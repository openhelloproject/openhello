<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy for openhellod. Installed to
  /usr/share/dbus-1/system.d/org.openhello.Daemon1.conf.
  Authenticate and GetAuthMethods are root-only here AND in the daemon
  (service.py).
-->
<busconfig>
  <policy user="root">
    <allow own="org.openhello.Daemon1"/>
    <allow send_destination="org.openhello.Daemon1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.openhello.Daemon1"
           send_interface="org.openhello.Daemon1"/>
    <deny send_destination="org.openhello.Daemon1"
          send_interface="org.openhello.Daemon1" send_member="Authenticate"/>
    <deny send_destination="org.openhello.Daemon1"
          send_interface="org.openhello.Daemon1" send_member="GetAuthMethods"/>
    <allow send_destination="org.openhello.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.openhello.Daemon1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.openhello.Daemon1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
  </policy>
</busconfig>
